<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYBR LIGHT — Forest game renderer</title>
<style>body{margin:0;background:#151916;color:#e0e8df;font:14px system-ui}header{display:flex;align-items:center;gap:22px;padding:14px 24px}a{color:inherit}button,select{background:#27342b;color:inherit;border:1px solid #526455;padding:8px}canvas{display:block;width:100%;height:calc(100vh - 112px);object-fit:contain}footer{padding:12px 24px;display:flex;gap:24px}.play-hint{position:fixed;bottom:30px;left:30px;background:#152019;padding:12px}.play-active canvas{position:fixed;inset:0;width:100%;height:100%}.play-active header,.play-active footer{display:none}#status{position:absolute;top:85px;left:24px;background:#162019dd;padding:10px}#status:empty{display:none}</style>
<header><strong>CYBR LIGHT / FOREST</strong><select id="view"><option value="trail">Trail</option><option value="canopy">Canopy</option><option value="sky">Under crowns</option><option value="clearing">Clearing</option><option value="overview">Whole stand</option></select><select id="detail" aria-label="Geometry detail"><option value="0.75">Detail: 0.75 px error</option><option value="1.5">Detail: 1.5 px error</option><option value="0">Full geometry</option></select><a href="./?scene=forest">Path-traced reference</a></header>
