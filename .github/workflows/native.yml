name: Native and browser source

on:
  push:
    paths:
      - 'include/**'
      - 'src/**'
      - 'python/**'
      - 'tests/**'
      - 'tools/**'
      - 'examples/**'
      - 'browser/**'
      - 'docs/**'
      - 'README.md'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/native.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/check_repository.py
      - run: python tools/examples.py anisotropy dielectrics cloud --preset smoke --threads 2 --out rendered/ci
      - name: Save optional smoke evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-evidence
          path: |
            rendered/ci/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
  browser-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test browser/*.test.mjs
