[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybr-light"
version = "0.2.0"
description = "Independent native spectral renderer with executable capability examples"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "Pillow>=9"]

[project.optional-dependencies]
tensor = ["torch>=2.1"]
exr = ["opencv-python-headless>=4.8"]
test = ["pytest>=7"]
portable = ["numba>=0.65", "llvmlite>=0.47"]

[project.scripts]
cybrlight = "cybrlight.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
